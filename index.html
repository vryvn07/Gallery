<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" id="theme-color-meta" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Gallery" />
    <title>Gallery</title>
    <script>
      // Strict theme initialization: Default to Light mode unless 'dark' is explicitly saved
      try {
        const savedTheme = localStorage.getItem('gallery_theme');
        if (savedTheme === 'dark') {
          document.documentElement.classList.add('dark');
          const meta = document.getElementById('theme-color-meta');
          if (meta) meta.setAttribute('content', '#0f1117');
        } else {
          document.documentElement.classList.remove('dark');
          const meta = document.getElementById('theme-color-meta');
          if (meta) meta.setAttribute('content', '#ffffff');
        }
      } catch (e) {
        document.documentElement.classList.remove('dark');
      }
    </script>
  </head>
  <body class="bg-white dark:bg-[#0f1117] text-slate-900 dark:text-slate-100 antialiased selection:bg-blue-100 dark:selection:bg-blue-900/50">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
